# MobAI: textos que ven los jugadores, en formato MiniMessage (https://docs.advntr.dev/minimessage/format.html).
# Lo que va entre <...> sin formato (por ejemplo <reason>) lo completa el plugin.

no-permission: "<red>No tenés permiso para usar este comando."
unknown-subcommand: "<red>Subcomando desconocido. <gray>Usá: /mobai <spawngroup|reinforce|status|memory|reset|train|reload|debug>"
reload-done: "<green>Configuración recargada."
reload-failed: "<red>No se recargó la configuración: <gray><reason>"
player-only: "<red>Este comando lo tiene que usar un jugador."
unknown-policy: "<red>Política desconocida: <gray><policy></gray>. Usá una de: <gray><valid>"
group-spawned: "<green>Grupo <white><group></white> creado con <white><policy></white>."
status-line: "<gray><group></gray> <white><state></white> · <policy> · <members> miembros · estrategia <strategy> · objetivo <target>"
no-groups: "<gray>No hay grupos activos."
group-not-found: "<red>No hay un grupo <gray><group></gray>."
reset-all: "<green>Memoria borrada en <white><groups></white> grupos."
reset-player: "<green>Memoria de <white><player></white> borrada en <white><groups></white> grupos."
player-not-found: "<red>No hay un jugador conectado llamado <gray><player></gray>."
unknown-level: "<red>Nivel desconocido: <gray><level></gray>. Usá uno de: <gray><valid>"
debug-set: "<green>Grupo <white><group></white>: traza en <white><level></white>."
debug-set-all: "<green>Todos los grupos: traza en <white><level></white>."
memory-empty: "<gray>Ningún grupo activo recuerda a <white><player></white>."
memory-group: "<gold>Grupo <white><group></white> · peligro <white><danger></white> <gray>(perdió <lost> de vida, le hizo <dealt> de daño)"
memory-strategy: "<gray>  estrategia <white><strategy></white>: <white><rate>%</white> · <support> planes"
memory-attack: "<gray>  ataque <white><attack></white>: <white><rate>%</white> · <support> intentos"
reinforce-usage: "<red>Usá: <gray>/mobai reinforce [grupo]</gray>. Los grupos están en <gray>/mobai status</gray>."
group-full: "<yellow>El grupo <white><group></white> ya tiene <white><members></white> miembros: no entra nadie más."
group-reinforced: "<green>Grupo <white><group></white> reforzado con <white><added></white> mobs (<members> en total)."
train-usage: "<red>Usá: <gray>/mobai train <on|off> <jugador></gray> o <gray>/mobai train status</gray>."
train-on: "<green><white><player></white> entra en entrenamiento: sus peleas le enseñan a la base del server."
train-off: "<green><white><player></white> sale del entrenamiento."
train-status: "<gray>Base del server: <white><plans></white> planes (pesa hasta <white><cap></white>). En entrenamiento: <white><trainers></white>."
train-status-nobody: "<gray>Base del server: <white><plans></white> planes (pesa hasta <white><cap></white>). Nadie en entrenamiento."
train-strategies: "<yellow>El planificador es STRATEGIES: el entrenamiento no hace nada hasta poner <gray>planner: \"RECIPES\"</gray>."
