# MobAI: textos que ven los jugadores, en formato MiniMessage (https://docs.advntr.dev/minimessage/format.html).
# Lo que va entre <...> sin formato (por ejemplo <reason>) lo completa el plugin.

no-permission: "<red>No tenés permiso para usar este comando."
unknown-subcommand: "<red>Subcomando desconocido. <gray>Usá: /mobai <spawngroup|status|memory|reset|reload>"
reload-done: "<green>Configuración recargada."
reload-failed: "<red>No se recargó la configuración: <gray><reason>"
player-only: "<red>Este comando lo tiene que usar un jugador."
unknown-policy: "<red>Política desconocida: <gray><policy></gray>. Usá una de: <gray><valid>"
group-spawned: "<green>Grupo <white><group></white> creado con <white><policy></white>."
status-line: "<gray><group></gray> <white><state></white> · <policy> · <members> miembros · estrategia <strategy> · objetivo <target>"
no-groups: "<gray>No hay grupos activos."
group-not-found: "<red>No hay un grupo <gray><group></gray>."
reset-all: "<green>Memoria borrada en <white><groups></white> grupos."
reset-player: "<green>Memoria de <white><player></white> borrada en <white><groups></white> grupos."
player-not-found: "<red>No hay un jugador conectado llamado <gray><player></gray>."
