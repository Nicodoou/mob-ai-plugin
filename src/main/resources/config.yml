# MobAI: configuración. Los valores son los del catálogo del MVP.
# Los tiempos van en ticks (20 ticks = 1 segundo) y las distancias, en bloques.
# Después de editar, aplicá los cambios con /mobai reload.

group:
  # Mobs por grupo como máximo.
  max-size: 12
  # Cada cuántos ticks decide el cerebro de cada grupo.
  decision-interval-ticks: 10
  # Distancia a la que un grupo ve a los jugadores.
  detection-radius-blocks: 24.0

memory:
  # Ticks para que lo aprendido pese la mitad (12.000 = 10 minutos de server prendido).
  half-life-ticks: 12000
  # Entre 0 y 1: más alto, aprende más rápido (1,0 calibrado en la simulación).
  learning-speed: 1.0
  # Cuánto vale un golpe bloqueado con escudo frente a uno que entra (0 a 1).
  partial-hit-weight: 0.5

selection:
  # THOMPSON_SAMPLING, EPSILON_GREEDY, EXPLORE_FIRST o RANDOM (entre comillas).
  default-policy: "THOMPSON_SAMPLING"
  memory-multiplier-min: 0.5
  memory-multiplier-max: 1.5
  # Para EPSILON_GREEDY: probabilidad de elegir al azar.
  epsilon: 0.1
  # Para EXPLORE_FIRST: intentos al azar antes de usar la memoria.
  explore-first-attempts: 10

target:
  # Cuánto tiempo cuenta el daño que hizo un jugador para su amenaza.
  threat-window-ticks: 600
  # Bonus por seguir con el mismo objetivo (0,2 = +20 %).
  commitment-bonus: 0.2
  base-threat: 1.0
  approach-speed-blocks-per-second: 3.0
  weakness-threat-multiplier-per-level: 0.5

plan:
  max-duration-ticks: 600
  target-lost-distance-blocks: 32.0
  target-lost-ticks: 200
  # Vida (fracción) a la que un mob pasa a retirarse.
  retreat-health-fraction: 0.3
  # Fracción de la vida del objetivo que hay que sacarle para un plan exitoso.
  full-success-damage-fraction: 0.5
  # Fuerza del grupo (vida que conserva, contando a los muertos) por debajo de la cual se
  # retira todo junto.
  group-retreat-strength: 0.4

attack:
  projectile-timeout-ticks: 60
  patient-strike-max-wait-ticks: 60
  opportunistic-shot-max-wait-ticks: 60
  # Distancia a la que pelean los esqueletos; se ubican en el medio (CT-21).
  shoot-min-distance-blocks: 20.0
  shoot-max-distance-blocks: 30.0
  # Lo que el flanqueador se mantiene más allá del alcance del jugador mientras lo ve.
  flank-margin-blocks: 1.0
  retreat-distance-blocks: 16.0
  # Golpe esquivo: cuánto más allá del alcance del jugador se aparta el zombie.
  evasive-margin-blocks: 0.5
  # Golpe esquivo: ticks de más para reaccionar (el goal decide uno sí y uno no, y el camino tarda en
  # arrancar) y grados de más, además del ancho del mob, que se aparta de la mira del jugador que se cubre.
  evasive-safety-ticks: 4
  evasive-aim-margin-degrees: 15.0
  # Distancia mínima entre los lugares altos de dos esqueletos (B-08), en bloques. Con 0 pueden compartir la misma colina.
  perch-spacing-blocks: 3.0

spider:
  # Lentitud I por 3 segundos.
  slowness-duration-ticks: 60
  slowness-level: 1

persistence:
  # Cada cuánto se guardan las memorias (6.000 = 5 minutos); también se guardan al apagar.
  save-interval-ticks: 6000

debug:
  # OFF, DECISIONS o FULL (entre comillas: sin comillas, YAML lee OFF como false).
  default-trace-level: "OFF"
  flight-recorder-events: 200
  # Con el nivel "full", cada cuántos ticks se graba cada mob, grupo y jugador en el trace (CT-36).
  # Sin límite de tamaño: una sesión larga puede pesar mucho.
  recording-interval-ticks: 5

retreat:
  # Vida (fracción) a la que un mob vuelve a pelear; tiene que ser mayor que retreat-health-fraction.
  recovery-health-fraction: 0.6
  # Sin jugadores a esta distancia, un mob en retirada se cura.
  heal-safe-distance-blocks: 12.0
  # Ventana de reagrupamiento: arranca en este valor y aprende entre el mínimo y el máximo.
  regroup-initial-ticks: 600
  regroup-min-ticks: 200
  regroup-max-ticks: 1200
  regroup-step-ticks: 50
  # Al reagruparse, el grupo se junta en un punto a esta distancia de su centro, lejos del jugador (CT-29).
  rally-distance-blocks: 12.0
  # A esta distancia del punto de reunión, el mob ya llegó.
  rally-arrival-blocks: 3.0

volley:
  # Andanada (CT-23): los cuerpo a cuerpo presionan, se abren, y los esqueletos disparan juntos.
  # Múltiplos de 10: el grupo decide cada 10 ticks.
  press-ticks: 60
  fall-back-ticks: 20
  fire-ticks: 30
  # Cuánto más allá del alcance del jugador se abren los cuerpo a cuerpo.
  fall-back-margin-blocks: 1.5

relay:
  # Relevo de golpes: el grupo reparte el daño para que ningún golpe caiga dentro de la ventana de
  # invulnerabilidad del objetivo. Los valores van en ticks.
  # Cuánto después del cierre de la ventana apunta a llegar una flecha, por el error del vuelo
  # estimado (0 o más).
  arrow-margin-ticks: 1
  # Con un cuerpo a cuerpo listo, cuánto más tarde que eso puede llegar una flecha antes de
  # esperar al cierre siguiente (1 o más: los goals corren cada 2 ticks).
  arrow-slack-ticks: 2
  # Cuánto después de la llegada estimada de una flecha se la sigue esperando; pasado esto se la
  # da por errada (0 o más).
  landing-grace-ticks: 2
  # Máximo que un esqueleto con el arco tenso aguanta la flecha buscando una ventana libre (1 o
  # más). Lo aguantado se descuenta del ritmo del disparo siguiente.
  max-shot-hold-ticks: 20
  # Sin volver a pedir su turno durante esto, un cuerpo a cuerpo pierde su lugar en la fila (2 o
  # más: los goals corren cada 2 ticks).
  ready-stale-ticks: 3

success:
  # Éxito de un plan (CT-27): el ataque (daño hecho y rapidez, con sus pesos) multiplicado por cuánto
  # sobrevivió el grupo; survival-weight es cuánto descuenta perder al grupo entero.
  damage-weight: 0.4
  speed-weight: 0.4
  survival-weight: 0.2
  # Rapidez: comparada con matar al objetivo en estos ticks.
  reference-kill-ticks: 600
  # Contra jugadores muy buenos, el peso de la supervivencia sube de survival-weight hasta este valor.
  survival-weight-max: 0.6
  # Vida que pierde el grupo por cada punto de daño que le hace al jugador: desde low el peso empieza
  # a subir; en high llega al máximo.
  danger-ratio-low: 2.0
  danger-ratio-high: 8.0
  # Daño de referencia: con poca pelea, el jugador cuenta como normal.
  danger-prior-damage: 10.0

learning:
  # Quién decide los planes (CT-30): "STRATEGIES" (las 4 estrategias de siempre) o "RECIPES" (recetas aprendidas).
  planner: "STRATEGIES"
  # Modelo de recetas, calibrado con la simulación (docs/plan/calibracion-recetas.md).
  model-noise-variance: 0.01
  prior-variance: 1.0
  prior-success: 0.5
  # Exploración del sorteo: en el juego y en el modo entrenamiento.
  exploration-scale: 1.0
  training-exploration-scale: 2.0
  # Cuándo entra la reserva de zombies (ticks) y umbral máximo de retirada que se prueba (por debajo de recovery-health-fraction).
  min-reserve-delay-ticks: 20
  max-reserve-delay-ticks: 400
  max-retreat-health-fraction: 0.5
  # Vida media de lo que se recuerda de cada jugador (escudo, arco, armadura).
  traits-half-life-ticks: 6000
  # Cuánto pesa la base del server para un jugador nuevo, en planes (0: no se usa).
  base-weight-plans: 600
  # Umbral máximo de retirada de todo el grupo que se prueba (CT-33).
  max-group-retreat-strength: 0.6
  # Arranque en el medio (D-02): cuánto prefiere el modelo, antes de aprender, el medio de las
  # perillas continuas. Calibrado con la simulación (docs/plan/calibracion-recetas.md).
  mid-knob-prior: 2.0

pack:
  # Persecución en bloque (CT-32): un mob cuerpo a cuerpo que va más de esto por delante del más
  # atrasado espera al resto (orden GATHER).
  max-spread-blocks: 8.0
  # A esta distancia del objetivo o menos ya está peleando y no espera a nadie.
  engaged-distance-blocks: 4.0
  # Zombies que rodean (CT-32): margen sobre la separación que evita que el barrido de la espada
  # alcance a dos.
  surround-margin-blocks: 0.25
  # Los zombies que esperan turno se quedan esto más allá del alcance del jugador.
  wait-margin-blocks: 1.0
  # Correa (CT-33): cuánto más se puede alejar el jugador del terreno donde empezó la pelea antes
  # de que los cuerpo a cuerpo vuelvan a él. La perilla aprendida chaseCommitment elige entre estos
  # dos valores.
  min-chase-blocks: 8.0
  max-chase-blocks: 32.0
